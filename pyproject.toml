[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "evoparam"
dynamic = ["version"]
description = "Parameterizing evoked neural responses, from raw recordings to peak parameters"
readme = "README.rst"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Yann V. Bellec" }]
keywords = ["neuroscience", "evoked responses", "ERP", "CCEP", "SPES", "iEEG",
            "electrophysiology", "stimulation artifact", "parameterization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["numpy", "scipy>=1.8"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
data = ["pandas"]
mne = ["mne>=1.6"]
edf = ["edfio>=0.4"]
stats = ["statsmodels>=0.14", "formulaic>=1.0"]
validate = ["jsonschema>=4.18", "bidsschematools>=0.7", "nwbinspector>=0.5"]
cli = ["pandas", "tqdm"]
bayes = ["numpyro>=0.15", "jax>=0.4.30", "pymc>=5.10", "arviz>=0.18"]
progress = ["tqdm"]
tests = ["pytest", "pytest-cov"]
all = ["matplotlib", "pandas", "tqdm", "jsonschema>=4.18", "pytest", "pytest-cov"]

[project.scripts]
evoparam = "evoparam.cli:main"

[project.urls]
Source = "https://github.com/yannbellec/evoparam"
"Bug Reports" = "https://github.com/yannbellec/evoparam/issues"

[tool.setuptools.dynamic]
version = { attr = "evoparam.version.__version__" }

[tool.setuptools.packages.find]
include = ["evoparam*"]

[tool.setuptools.package-data]
"evoparam.io" = ["registry.json"]
"evoparam.existence" = ["rules.json"]
"evoparam.tf" = ["zones.json"]
"evoparam.presets" = ["*.json"]
"evoparam.reports" = ["schema/*.json"]
"evoparam" = ["CITATION.cff"]
"evoparam.tests.sim" = ["reference_sim.json"]
"evoparam.tests.reports" = ["methods/*.txt"]
"evoparam.tests.data" = ["containers/*.evoparam/*", "containers/*.evoparam/tables/*"]

[tool.pytest.ini_options]
testpaths = ["evoparam"]
markers = [
    "network: reads public data over the internet; skipped unless EVOPARAM_NETWORK_TESTS=1",
]
