[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "evoparam"
dynamic = ["version"]
description = "Parameterizing evoked neural responses, from raw recordings to peak parameters"
readme = "README.rst"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Yann V. Bellec" }]
keywords = ["neuroscience", "evoked responses", "ERP", "CCEP", "SPES", "iEEG",
            "electrophysiology", "stimulation artifact", "parameterization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    # PyPI refuses this classifier: no upload before the HIIE decision (RELEASING.md)
    "Private :: Do Not Upload",
]
dependencies = ["numpy>=1.24,<3", "scipy>=1.10"]  # version floors of spec §9.2

[project.optional-dependencies]
# Spec §9.2: one extra per row of the table; `all` is the union of every extra except
# `gpu`, `bayes` and `docs`. `sklearn` and `nwb`'s h5py/remfile are kept for the code that
# uses them (scikit-learn >= 1.6 for the estimator tags API, remote NWB reads). `brain`
# (nilearn) draws the glass brain of spec §5.9 method 3 ("the nilearn plotting backend is
# used when installed"). `pybids` (named in the `bids` row of the table) is not declared:
# every release from 0.16 requires num2words (and from 0.19 frozendict), whose copyleft
# licences REQ-395 keeps out of the resolved tree of every extra; evoparam never imports it
# (docs/spec/DECISIONS.md, section 5.7).
mne = ["mne>=1.6"]
bids = ["mne-bids>=0.15"]
nwb = ["pynwb>=2.6", "hdmf>=3.12", "ndx-events>=0.2", "h5py", "remfile"]
neo = ["neo>=0.13", "quantities"]
edf = ["edfio>=0.4"]
bayes = ["numpyro>=0.14", "jax>=0.4.30", "arviz>=0.18", "pymc>=5.10"]
gpu = ["jax[cuda12]>=0.4.30"]
fast = ["numba>=0.59"]
plot = ["matplotlib>=3.7"]
brain = ["nilearn>=0.10"]
data = ["pandas>=2.0", "pyarrow>=14"]
xarray = ["xarray>=2023.1"]
stats = ["statsmodels>=0.14", "formulaic>=1.0"]
validate = ["bidsschematools>=0.7", "nwbinspector>=0.5", "jsonschema>=4.18"]
cli = ["pandas>=2.0", "pyarrow>=14", "tqdm>=4.66", "tomli>=2; python_version < '3.11'"]
progress = ["tqdm>=4.66"]
parallel = ["joblib>=1.3"]
stream = ["pylsl>=1.16"]
sklearn = ["scikit-learn>=1.6"]
docs = ["sphinx>=7", "pydata-sphinx-theme>=0.15", "sphinx-gallery>=0.16", "numpydoc>=1.7",
        "sphinx-copybutton", "sphinxcontrib-bibtex>=2.6", "myst-parser>=3", "matplotlib",
        "pandas", "mne>=1.6", "pynwb>=2.6", "neo>=0.13", "scikit-learn>=1.6"]
tests = ["pytest>=8", "pytest-cov>=5", "pytest-timeout>=2.3", "pytest-xdist>=3.5",
         "hypothesis>=6.100", "scikit-learn>=1.6", "bidsschematools>=0.7", "mypy>=1.10",
         "ruff>=0.5", "interrogate>=1.7", "mpmath>=1.3", "pyyaml>=6",
         "scipy-stubs", "types-PyYAML", "types-tabulate",
         "tomli>=2; python_version < '3.11'"]
all = ["mne>=1.6", "mne-bids>=0.15", "pynwb>=2.6", "hdmf>=3.12",
       "ndx-events>=0.2", "h5py", "remfile", "neo>=0.13", "quantities", "edfio>=0.4",
       "numba>=0.59", "matplotlib>=3.7", "nilearn>=0.10", "pandas>=2.0", "pyarrow>=14",
       "xarray>=2023.1",
       "statsmodels>=0.14", "formulaic>=1.0", "bidsschematools>=0.7", "nwbinspector>=0.5",
       "jsonschema>=4.18", "tqdm>=4.66", "joblib>=1.3", "pylsl>=1.16", "scikit-learn>=1.6",
       "pytest>=8", "pytest-cov>=5", "pytest-timeout>=2.3", "pytest-xdist>=3.5",
       "hypothesis>=6.100", "mypy>=1.10", "ruff>=0.5", "interrogate>=1.7", "mpmath>=1.3",
       "pyyaml>=6", "scipy-stubs", "types-PyYAML", "types-tabulate",
       "tomli>=2; python_version < '3.11'"]

[project.scripts]
evoparam = "evoparam.cli:main"

[project.urls]
Source = "https://github.com/yannbellec/evoparam"
"Bug Reports" = "https://github.com/yannbellec/evoparam/issues"

[tool.setuptools.dynamic]
version = { attr = "evoparam.version.__version__" }

[tool.setuptools.packages.find]
include = ["evoparam*"]

[tool.setuptools.package-data]
"evoparam.io" = ["registry.json"]
"evoparam.io.ndx_evoparam" = ["spec/*.yaml"]
"evoparam.existence" = ["rules.json"]
"evoparam.tf" = ["zones.json"]
"evoparam.benchmark" = ["*.json", "schemas/*.json", "suites/*.json", "realdata/*.json"]
"evoparam.presets" = ["*.json"]
"evoparam.reports" = ["schema/*.json"]
"evoparam" = ["CITATION.cff", "py.typed"]
"evoparam.tests.reference" = ["*.json"]
"evoparam.tests.sim" = ["reference_sim.json"]
"evoparam.tests.reports" = ["methods/*.txt"]
"evoparam.tests.data" = ["containers/*.evoparam/*", "containers/*.evoparam/tables/*"]

[tool.pytest.ini_options]
testpaths = ["evoparam"]
markers = [
    "network: reads public data over the internet; skipped unless EVOPARAM_NETWORK_TESTS=1",
    "core: runs with numpy and scipy only (the core-only job of REQ-291/REQ-297)",
    "lsl: needs pylsl and the liblsl library (extra stream); skipped when they are missing",
]

# Static quality rules (spec §9.9, REQ-305; REQ-307: E722, S110, BLE001)
[tool.ruff]
line-length = 99
target-version = "py310"
# docs/spec/SPEC.md is the reviewed specification and is never edited: `ruff format` (and
# its pre-commit hook, which formats the Python blocks of Markdown files) leaves it as is
extend-exclude = ["adapters", "docs/spec/SPEC.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PT", "RET", "ARG", "PL",
          "NPY", "D", "C90", "E722", "S110", "BLE001"]
# PLC0415 (import outside top level) contradicts the lazy imports that REQ-292 requires
# (docs/spec/DECISIONS.md)
ignore = ["PLC0415"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-args = 8
max-statements = 60

[tool.ruff.lint.per-file-ignores]
"evoparam/tests/**" = ["D"]
# test_response (spec §5.6) and evoparam.tf.stats.test_map are statistical tests, not pytest
# tests: PT028 does not apply to their keyword defaults (docs/spec/DECISIONS.md §7)
"evoparam/existence/api.py" = ["PT028"]
"evoparam/tf/stats.py" = ["PT028"]

# Static typing (spec §9.6, REQ-301): optional packages only are allowed without stubs
[tool.mypy]
python_version = "3.10"
strict = true
files = ["evoparam"]
exclude = ["evoparam/tests/"]

[[tool.mypy.overrides]]
module = ["mne.*", "mne_bids.*", "bids.*", "pynwb.*", "hdmf.*", "ndx_events.*", "neo.*",
          "edfio.*", "pyedflib.*", "numpyro.*", "jax.*", "arviz.*", "pymc.*", "cupy.*",
          "numba.*", "matplotlib.*", "pandas.*", "pyarrow.*", "xarray.*", "statsmodels.*",
          "formulaic.*", "bidsschematools.*", "nwbinspector.*", "jsonschema.*", "tqdm.*",
          "joblib.*", "pylsl.*", "sklearn.*", "h5py.*", "remfile.*", "quantities.*",
          "nilearn.*", "patsy.*", "pytensor.*"]
# patsy (with statsmodels, extra `stats`) and pytensor (with pymc, extra `bayes`) ship no type
# information or are absent from the CI lock; neither is ever needed by the core
ignore_missing_imports = true

# Coverage (spec §9.5, REQ-298), lines and branches. Every module is measured (run.omit:
# the tests only). `coverage report` gates the core packages (report.include below) at
# >= 90 %; ci.yml adds `coverage report --include="evoparam/shapes/*" --fail-under=100`
# and the outer layers (plots, cli, stream, benchmark, remote I/O) at >= 80 %.
[tool.coverage.run]
source = ["evoparam"]
branch = true
omit = ["evoparam/tests/*"]

[tool.coverage.report]
fail_under = 90
show_missing = false
# the core packages of REQ-298: data, io local readers, events, artifact, prep, shapes,
# models, existence, trials, presets, utils (and the top-level modules they use)
include = ["evoparam/__init__.py", "evoparam/errors.py", "evoparam/version.py",
           "evoparam/_extras.py", "evoparam/_typing.py", "evoparam/_deprecated.py",
           "evoparam/_plugins.py", "evoparam/data/*", "evoparam/events/*",
           "evoparam/artifact/*", "evoparam/prep/*", "evoparam/shapes/*",
           "evoparam/models/*", "evoparam/existence/*", "evoparam/trials/*",
           "evoparam/presets/*", "evoparam/utils/*", "evoparam/io/__init__.py",
           "evoparam/io/_harmonize.py", "evoparam/io/_validate.py", "evoparam/io/bids.py",
           "evoparam/io/brainvision.py", "evoparam/io/derivatives.py",
           "evoparam/io/epochs.py", "evoparam/io/mef.py", "evoparam/io/neo.py",
           "evoparam/io/nwb.py", "evoparam/io/readers.py", "evoparam/io/ndx_evoparam/*"]

[tool.interrogate]
fail-under = 95
exclude = ["evoparam/tests"]
