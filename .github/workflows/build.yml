# This workflow runs CI tests: it installs Python dependencies and run tests across a variety of Python versions

name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      MODULE_NAME: evoparam
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[all]"
    - name: Test with pytest
      run: |
        pytest --cov=./ -rf --junitxml=pytest-report.xml
    - name: Report failed tests as annotations
      if: failure()
      run: |
        python - <<'EOF'
        import os
        import xml.etree.ElementTree as ET
        if os.path.exists("pytest-report.xml"):
            root = ET.parse("pytest-report.xml").getroot()
            for case in root.iter("testcase"):
                for tag in ("failure", "error"):
                    node = case.find(tag)
                    if node is not None:
                        message = " ".join((node.get("message") or "").split())[:500]
                        print(f"::error title={case.get('classname')}.{case.get('name')}::{message}")
        EOF
    - name: Run doctests
      run: |
        pytest --doctest-modules --ignore=$MODULE_NAME/tests $MODULE_NAME
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
