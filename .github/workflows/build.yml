# CI: the test matrix on every push and pull request; the reference BIDS validator (`docs`
# job, REQ-315); and the network, slow and performance tests (`network-slow-perf`, weekly
# and on demand, decision D16 of docs/spec/DECISIONS.md). The same full run is available
# locally with tools/run_all_tests.py.

name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 2 * * 6"
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      MODULE_NAME: evoparam
      EVOPARAM_DATA: ${{ github.workspace }}/.evoparam-data
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[all]"
    - name: Test with pytest
      run: |
        pytest --cov=./ -rf --junitxml=pytest-report.xml
    - name: Run doctests
      run: |
        pytest --doctest-modules --ignore=$MODULE_NAME/tests $MODULE_NAME --junitxml=doctest-report.xml
    - name: Cache the OpenNeuro files of the N1 tests
      uses: actions/cache@v4
      with:
        path: .evoparam-data
        key: evoparam-data-n1-v1
    - name: REQ-113 and REQ-114 in every build (REQ-017)
      env:
        EVOPARAM_NETWORK_TESTS: "1"
      run: |
        pytest -rfx evoparam/tests/models/test_engine_ccep.py --junitxml=n1-report.xml
    - name: Report failed tests as annotations
      if: failure()
      run: |
        python - <<'EOF'
        import os
        import xml.etree.ElementTree as ET
        for report in ("pytest-report.xml", "doctest-report.xml", "n1-report.xml"):
            if not os.path.exists(report):
                continue
            root = ET.parse(report).getroot()
            for case in root.iter("testcase"):
                for tag in ("failure", "error"):
                    node = case.find(tag)
                    if node is not None:
                        message = " ".join((node.get("message") or node.text or "").split())[:500]
                        print(f"::error title={case.get('classname')}.{case.get('name')}::{message}")
        EOF
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4

  docs:
    # REQ-315: the reference BIDS validator is the Node.js bids-validator@2, run with npx in
    # derivative mode (spec §9.2). npm has no 2.x release of bids-validator (2026-10-09:
    # latest 1.15.0), so test_req315_reference_validator_as_written is an expected failure
    # until it has one; the 2.x/3.x validator of JSR (@bids/validator, pinned) runs the
    # REQ-342 checks on the raw dataset and the derivatives.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    - uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[all]"
    - name: Validate the written datasets
      env:
        EVOPARAM_NETWORK_TESTS: "1"
        EVOPARAM_BIDS_VALIDATOR: "deno run -A jsr:@bids/validator@3.0.2"
      run: |
        pytest -rsx evoparam/tests/io/test_bids_derivatives.py

  network-slow-perf:
    # Every test, with EVOPARAM_NETWORK_TESTS, EVOPARAM_SLOW_TESTS and EVOPARAM_PERF_TESTS
    # set and the bayes extra installed (REQ-172 to REQ-176 NUTS parts): spec §12 "REQs green
    # in CI", REQ-017, F3/F4 of the audit. Weekly and on demand; the OpenNeuro files are
    # cached between runs. Same run as `python tools/run_all_tests.py`.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      EVOPARAM_DATA: ${{ github.workspace }}/.evoparam-data
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Cache the OpenNeuro files
      uses: actions/cache@v4
      with:
        path: .evoparam-data
        key: evoparam-data-full-v1
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[all,bayes]"
    - name: Run every test
      run: |
        python tools/run_all_tests.py --doctests --out test-reports/full
    - name: Keep the reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: network-slow-perf-report
        path: test-reports/full/
