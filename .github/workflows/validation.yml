# Layer-2 scientific validation (spec §7.2, REQ-370): the simulation grid and the
# simulation-based acceptance tests, weekly, with the report kept as an artifact.

name: validation

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  layer2:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[all]"
    - name: Run layer 2
      run: |
        python validation/layer2.py --design weekly --replicates 50 --jobs -1
    - name: Keep the report
      uses: actions/upload-artifact@v4
      with:
        name: layer2-report
        path: validation/layer2/
