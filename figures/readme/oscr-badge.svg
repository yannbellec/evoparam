<svg xmlns="http://www.w3.org/2000/svg" width="520" height="88" viewBox="0 0 520 88">
<defs>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#6E40C9"/><stop offset="0.5" stop-color="#56B4E9"/><stop offset="1" stop-color="#6E40C9"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="4s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.14"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
</linearGradient>
<linearGradient id="fill" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#161B22"/><stop offset="1" stop-color="#0D1117"/>
</linearGradient>
<clipPath id="card"><rect x="3" y="3" width="514" height="82" rx="16"/></clipPath>
</defs>
<style>
.big{font:800 30px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#F0F6FC;letter-spacing:2px}
.small{font:700 11px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#A371F7;letter-spacing:2.5px}
.sub{font:400 13px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#9198A1}
.go{font:600 13px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#F0F6FC}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-origin:52px 44px}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.35}50%{transform:scale(1.25);opacity:0}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
</style>
<rect x="1.5" y="1.5" width="517" height="85" rx="17" fill="none" stroke="url(#edge)" stroke-width="3"/>
<rect x="3" y="3" width="514" height="82" rx="16" fill="url(#fill)"/>
<g clip-path="url(#card)">
<rect x="-200" y="0" width="160" height="88" fill="url(#shine)" transform="skewX(-20)">
<animate attributeName="x" values="-200;700;700" keyTimes="0;0.45;1" dur="5s" repeatCount="indefinite"/>
</rect>
</g>
<circle class="pulse" cx="52" cy="44" r="24" fill="#6E40C9"/>
<circle cx="52" cy="44" r="22" fill="#6E40C9"/>
<path d="M41 44.5l7.5 7.5 14.5-15" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text class="small" x="92" y="30">LISTED ON</text>
<text class="big" x="90" y="60">OSCR</text>
<text class="sub" x="196" y="58">Open Scientific Code Registry</text>
<rect x="408" y="29" width="94" height="30" rx="15" fill="#6E40C9"/>
<text class="go" x="455" y="49" text-anchor="middle">View entry &#8250;</text>
</svg>
